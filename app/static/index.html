<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zimage</title>
<link rel="stylesheet" href="/static/admin.css">
<script src="/static/admin.js" defer></script>
</head>
<body>
<header class="header">
  <h1>zimage</h1>
  <button class="btn btn-secondary btn-compact" id="logout-btn">退出</button>
</header>

<nav class="tabs" aria-label="管理页签">
  <button class="tab active" data-tab="status">状态总览</button>
  <button class="tab" data-tab="config">配置管理</button>
  <button class="tab" data-tab="test">图片测试</button>
  <button class="tab" data-tab="models">模型列表</button>
</nav>

<main>
  <section class="content tab-content" id="tab-status">
    <div class="cards">
      <article class="card">
        <div class="label">服务状态</div>
        <div class="value" id="st-status">
          <span class="status-dot" id="st-dot"></span><span id="st-text">--</span>
        </div>
      </article>
      <article class="card">
        <div class="label">缓存数量</div>
        <div class="value" id="st-cache">--</div>
      </article>
      <article class="card">
        <div class="label">内存占用</div>
        <div class="value" id="st-memory">--</div>
      </article>
      <article class="card">
        <div class="label">总请求</div>
        <div class="value" id="st-total">--</div>
      </article>
      <article class="card">
        <div class="label">成功</div>
        <div class="value green" id="st-success">0</div>
      </article>
      <article class="card">
        <div class="label">失败</div>
        <div class="value red" id="st-fail">0</div>
      </article>
    </div>

    <div class="section">
      <h2>API Key</h2>
      <div class="key-text" id="st-apikey">--</div>
    </div>
    <button class="btn btn-secondary" id="refresh-stats-btn">刷新</button>
  </section>

  <section class="content tab-content hidden" id="tab-config">
    <div class="section">
      <h2>配置项</h2>
      <div class="form-row">
        <label for="cfg-apikey">API Key</label>
        <input type="password" id="cfg-apikey" placeholder="输入新的 API Key">
      </div>
      <div class="form-row">
        <label>当前 Key</label>
        <span class="key-text muted" id="cfg-apikey-current">--</span>
      </div>
      <div class="form-row">
        <label for="cfg-ttl">缓存 TTL (秒)</label>
        <input type="number" id="cfg-ttl" min="60">
      </div>
      <div class="form-row">
        <label for="cfg-maxsize">最大缓存数</label>
        <input type="number" id="cfg-maxsize" min="1">
      </div>
      <div class="form-row">
        <label for="cfg-nologo">nologo</label>
        <label class="toggle">
          <input type="checkbox" id="cfg-nologo"><span class="slider"></span>
        </label>
      </div>
      <div class="form-row">
        <label for="cfg-private">private</label>
        <label class="toggle">
          <input type="checkbox" id="cfg-private"><span class="slider"></span>
        </label>
      </div>
      <button class="btn btn-primary form-action" id="save-config-btn">保存配置</button>
    </div>
  </section>

  <section class="content tab-content hidden" id="tab-test">
    <div class="section">
      <h2>图片生成测试</h2>
      <div class="form-row">
        <label for="test-model">模型</label>
        <select id="test-model"></select>
      </div>
      <div class="form-row block-row">
        <label for="test-prompt">Prompt</label>
        <textarea id="test-prompt" placeholder="A beautiful sunset over mountains"></textarea>
      </div>
      <div class="form-row">
        <label>尺寸</label>
        <div class="size-presets">
          <button class="chip active" data-size="1024x1024">1024x1024</button>
          <button class="chip" data-size="1024x768">1024x768</button>
          <button class="chip" data-size="768x1024">768x1024</button>
          <button class="chip" data-size="1280x720">1280x720</button>
          <button class="chip" data-size="512x512">512x512</button>
        </div>
      </div>
      <button class="btn btn-primary form-action" id="test-btn">生成图片</button>
      <div id="test-result" class="hidden image-result">
        <img id="test-img" class="result-img" alt="Generated image">
      </div>
    </div>
  </section>

  <section class="content tab-content hidden" id="tab-models">
    <div class="section">
      <h2>可用模型</h2>
      <table>
        <thead><tr><th>#</th><th>模型 ID</th><th>所有者</th></tr></thead>
        <tbody id="models-tbody"></tbody>
      </table>
    </div>
    <button class="btn btn-secondary" id="refresh-models-btn">刷新</button>
  </section>
</main>

<div class="toast" id="toast"></div>
</body>
</html>
